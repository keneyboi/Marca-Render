{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Welcome to Marca{% endblock %}</title>
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <div class="dashboard-wrapper">

    <!-- Mobile Overlay Backdrop -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMenu()"></div>

    <!-- Sidebar / Mobile Header -->
    <aside class="dashboard-sidebar" id="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="{% url 'landing' %}" class="logo" style="color: #ffffff;">marca</a>
        <hr style='margin-bottom: -1rem'>
      </div>

      <!-- Hamburger Toggle (Mobile Only) -->
      <button class="hamburger-toggle" aria-label="Toggle navigation" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Drawer Content Wrapper -->
      <div class="drawer-content" id="drawer-content">
        <nav class="sidebar-nav">
          <a href="{% url 'home' %}" class="sidebar-link">Home</a>
          <a href="#" class="sidebar-link">Profile</a>
          <a href="#" class="sidebar-link">Settings</a>
        </nav>

        <div class="sidebar-footer">
          <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="logout-btn-sidebar">Logout</button>
          </form>
        </div>
      </div>
    </aside>

    <!-- Right Main View Area -->
    <main class="dashboard-main-content">
      {% block dashboard_content %}{% endblock %}
    </main>

  </div>

  <!-- JavaScript Toggle Controller -->
  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('dashboard-sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      
      sidebar.classList.toggle('menu-open');
      overlay.classList.toggle('active');
    }
  </script>
</body>
</html>
