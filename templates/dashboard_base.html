{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Welcome to Marca{% endblock %}</title>
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <div class="dashboard-wrapper">

    <!-- Mobile Overlay Backdrop -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMenu()"></div>

    <!-- Sidebar / Mobile Header -->
    <aside class="dashboard-sidebar" id="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="{% url 'landing' %}" class="logo" style="color: #ffffff;">marca</a>
        <hr style='margin-bottom: -1rem'>
      </div>

      <!-- Hamburger Toggle (Mobile Only) -->
      <button class="hamburger-toggle" aria-label="Toggle navigation" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Drawer Content Wrapper -->
      <div class="drawer-content" id="drawer-content">
        <nav class="sidebar-nav">
          <a href="{% url 'home' %}" class="sidebar-link">Home</a>
          <a href="#" class="sidebar-link">Profile</a>
          <a href="#" class="sidebar-link">Settings</a>
        </nav>

        <div class="sidebar-footer">
          <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn-secondary" style="width: 100%; padding: 1.5em 2rem; font-size: 1rem;">Logout</button>
          </form>
        </div>
      </div>
    </aside>

    <!-- Right Main View Area -->
    <main class="dashboard-main-content">

      {% block dashboard_content %}{% endblock %}
    </main>

  </div>

  <!-- JavaScript Toggle Controller -->
  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('dashboard-sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      
      sidebar.classList.toggle('menu-open');
      overlay.classList.toggle('active');
    }
    
    // Example usage in your Edit Modal submit handler:
    document.addEventListener('DOMContentLoaded', function () {
      const editForm = document.getElementById('editEventForm');
      if (!editForm) return;

      editForm.addEventListener('submit', function (e) {
        const dateVal = document.getElementById('edit_shared_event_date')?.value;
        const st1 = document.getElementById('edit_start_time_1_picker')?.value;
        const et1 = document.getElementById('edit_end_time_1_picker')?.value;
        const st2 = document.getElementById('edit_start_time_2_picker')?.value;
        const et2 = document.getElementById('edit_end_time_2_picker')?.value;
        const sessionType = document.getElementById('edit_session_type')?.value;

        // Validation checks
        if (!dateVal) {
          e.preventDefault();
          closeEditEventModal(); // Close modal so user sees dashboard alert
          showDashboardAlert('Please select an event date.', 'error');
          return false;
        }

        if (!st1 || !et1) {
          e.preventDefault();
          closeEditEventModal();
          showDashboardAlert('Please set both Start Time (1) and End Time (1).', 'error');
          return false;
        }

        if (st1 >= et1) {
          e.preventDefault();
          closeEditEventModal();
          showDashboardAlert('Session 1 end time must be after start time.', 'error');
          return false;
        }

        if (String(sessionType) === '3') {
          if (!st2 || !et2) {
            e.preventDefault();
            closeEditEventModal();
            showDashboardAlert('Please set both Start Time (2) and End Time (2).', 'error');
            return false;
          }

          if (st2 >= et2) {
            e.preventDefault();
            closeEditEventModal();
            showDashboardAlert('Session 2 end time must be after start time.', 'error');
            return false;
          }

          if (st2 <= et1) {
            e.preventDefault();
            closeEditEventModal();
            showDashboardAlert('Session 2 start time must begin after Session 1 end time.', 'error');
            return false;
          }
        }

        // Assign hidden input targets if valid
        document.getElementById('edit_start_time_1').value = `${dateVal}T${st1}`;
        document.getElementById('edit_end_time_1').value = `${dateVal}T${et1}`;

        if (String(sessionType) === '3' && st2 && et2) {
          document.getElementById('edit_start_time_2').value = `${dateVal}T${st2}`;
          document.getElementById('edit_end_time_2').value = `${dateVal}T${et2}`;
        } else {
          document.getElementById('edit_start_time_2').value = '';
          document.getElementById('edit_end_time_2').value = '';
        }
      });
    });
  </script>
</body>
</html>
