<!-- EDIT EVENT MODAL -->
<div id="editEventModal" class="custom-modal-overlay" style="display: none;">
  <div class="custom-modal-backdrop" onclick="closeEditEventModal()"></div>
  
  <div class="custom-modal-container">
    <div class="custom-modal-card">
      
      <!-- Modal Header -->
      <div class="modal-card-header">
        <div>
          <h3 class="modal-card-title">Edit Event Details</h3>
          <span style="color: #580c0c;">Update event information and session times below</span>
        </div>
        <button type="button" class="modal-close-btn" onclick="closeEditEventModal()">&times;</button>
      </div>

      <!-- Edit Form (Action dynamically populated via JS) -->
      <form id="editEventForm" method="POST" action="{% url 'edit_event' 0 %}" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Basic Event Details -->
        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="modal-label">EVENT NAME:</label>
          <input type="text" id="edit_event_name" name="name" class="form-control" required />
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="modal-label">LOCATION:</label>
          <input type="text" id="edit_event_location" name="location" class="form-control" required />
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="modal-label">DESCRIPTION:</label>
          <textarea id="edit_event_description" name="description" class="form-control" rows="3"></textarea>
        </div>


        <!-- Hidden inputs that Django processes -->
        <div style="display: none;">
          <input type="hidden" id="edit_session_type" name="session_type" value="1" />
          <input type="datetime-local" id="edit_start_time_1" name="start_time_1" />
          <input type="datetime-local" id="edit_end_time_1" name="end_time_1" />
          <input type="datetime-local" id="edit_start_time_2" name="start_time_2" />
          <input type="datetime-local" id="edit_end_time_2" name="end_time_2" />
        </div>

        <!-- Single Event Date -->
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="modal-label">EVENT DATE:</label>
          <input type="date" id="edit_shared_event_date" class="form-control" />
          <small id="error_edit_shared_event_date" class="error-message"></small>
        </div>

        <!-- Session 1 Time Pickers -->
        <div id="edit_time_1" style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label class="modal-label">START TIME (1):</label>
            <input type="text" id="edit_start_time_1_picker" class="form-control" placeholder="Select Time" readonly />
            <small id="error_edit_start_time_1" class="error-message"></small>
          </div>
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label class="modal-label">END TIME (1):</label>
            <input type="text" id="edit_end_time_1_picker" class="form-control" placeholder="Select Time" readonly />
            <small id="error_edit_end_time_1" class="error-message"></small>
          </div>
        </div>

        <!-- Session 2 Time Pickers -->
        <div id="edit_time_2" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; display: none;">
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label class="modal-label">START TIME (2):</label>
            <input type="text" id="edit_start_time_2_picker" class="form-control" placeholder="Select Time" readonly />
            <small id="error_edit_start_time_2" class="error-message"></small>
          </div>
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label class="modal-label">END TIME (2):</label>
            <input type="text" id="edit_end_time_2_picker" class="form-control" placeholder="Select Time" readonly />
            <small id="error_edit_end_time_2" class="error-message"></small>
          </div>
        </div>

        <!-- Form Actions -->
        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; border-top: 1px dashed #e5dfd8; padding-top: 1rem;">
          <button type="button" class="btn-secondary" onclick="closeEditEventModal()">Cancel</button>
          <button type="submit" class="btn-primary">SAVE CHANGES</button>
        </div>

      </form>

    </div>
  </div>
</div>
